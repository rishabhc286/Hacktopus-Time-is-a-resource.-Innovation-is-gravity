<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" fill="none">
  <!-- Chevron / arrow icon -->
  <g transform="translate(200, 10)">
    <!-- Top chevron (thicker) -->
    <polyline
      points="-52,0 0,38 52,0"
      fill="none"
      stroke="#1a1a1a"
      stroke-width="13"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Bottom chevron (thicker) -->
    <polyline
      points="-52,22 0,60 52,22"
      fill="none"
      stroke="#1a1a1a"
      stroke-width="13"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Vertical stem of the down-arrow -->
    <line x1="0" y1="-18" x2="0" y2="4" stroke="#1a1a1a" stroke-width="13" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text
    x="200"
    y="155"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54"
    font-weight="400"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="-1"
  >CodeCrafters</text>
</svg>
